name: Build and Deploy ecommerce-mcp

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-

      - run: npm ci
      - run: npm run build
      - run: npm run seed
      - run: npm test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Deploy to VPS
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: root
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            mkdir -p ecommerce-mcp
            cd ecommerce-mcp || exit 1
            git fetch origin master
            git reset --hard origin/master
            npm ci
            npm run build
            npm run seed
            systemctl restart ecommerce-mcp
