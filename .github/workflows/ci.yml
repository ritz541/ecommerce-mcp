name: Build and Deploy ecommerce-mcp

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build
      - run: npm run seed

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Deploy to VPS
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: root
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            cd ecommerce-mcp || exit 1
            git fetch origin master
            git reset --hard origin/master
            npm ci
            npm run build
            npm run seed
            systemctl restart ecommerce-mcp
